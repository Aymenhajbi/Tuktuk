# ── Railway Deployment Configuration ──────────────────────────────────────────
# This monorepo deploys as 3 separate Railway services.
# In the Railway dashboard, create one service per app and set:
#   "Root Directory" = (leave empty — build context is repo root)
#   "Dockerfile Path" = the path below for each service
#
#  Service          | Dockerfile Path
#  tuktuk-backend   | ai-dropship-saas/apps/backend/Dockerfile
#  tuktuk-admin     | ai-dropship-saas/apps/admin/Dockerfile
#  tuktuk-storefront| ai-dropship-saas/apps/storefront/Dockerfile
# ──────────────────────────────────────────────────────────────────────────────

# ── Backend service config (default — override per service in Railway UI) ─────
[build]
builder = "dockerfile"
dockerfilePath = "ai-dropship-saas/apps/backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "always"
numReplicas = 1
